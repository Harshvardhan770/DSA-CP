<svg width="100%" viewBox="0 0 880 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Calendar Manager Pro Banner</title>
  <desc>Banner for Calendar Manager Pro repository in C</desc>

  <rect width="880" height="200" rx="12" fill="#0a1628"/>

  <!-- subtle grid lines -->
  <g stroke="#1e3a5f" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="50" x2="880" y2="50"/>
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="150" x2="880" y2="150"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="700" y1="0" x2="700" y2="200"/>
    <line x1="800" y1="0" x2="800" y2="200"/>
  </g>

  <!-- calendar widget right side -->
  <rect x="610" y="25" width="240" height="155" rx="10" fill="#0f2544" stroke="#1e4a8a" stroke-width="1"/>

  <!-- calendar header -->
  <rect x="610" y="25" width="240" height="36" rx="10" fill="#1a3a6e"/>
  <rect x="610" y="43" width="240" height="18" fill="#1a3a6e"/>
  <text x="730" y="48" text-anchor="middle" fill="#60a5fa" font-size="12" font-family="Arial, sans-serif" font-weight="700">June 2025</text>

  <!-- day headers -->
  <g fill="#4b8bf5" font-size="9" font-family="Arial, sans-serif" font-weight="600">
    <text x="628" y="76" text-anchor="middle">Su</text>
    <text x="662" y="76" text-anchor="middle">Mo</text>
    <text x="696" y="76" text-anchor="middle">Tu</text>
    <text x="730" y="76" text-anchor="middle">We</text>
    <text x="764" y="76" text-anchor="middle">Th</text>
    <text x="798" y="76" text-anchor="middle">Fr</text>
    <text x="832" y="76" text-anchor="middle">Sa</text>
  </g>

  <!-- calendar days row 1 -->
  <g fill="#94a3b8" font-size="9" font-family="Arial, sans-serif">
    <text x="662" y="94" text-anchor="middle">2</text>
    <text x="696" y="94" text-anchor="middle">3</text>
    <text x="730" y="94" text-anchor="middle">4</text>
    <text x="764" y="94" text-anchor="middle">5</text>
    <text x="798" y="94" text-anchor="middle">6</text>
    <text x="832" y="94" text-anchor="middle">7</text>
  </g>
  <!-- row 2 -->
  <g fill="#94a3b8" font-size="9" font-family="Arial, sans-serif">
    <text x="628" y="110" text-anchor="middle">8</text>
    <text x="662" y="110" text-anchor="middle">9</text>
    <text x="696" y="110" text-anchor="middle">10</text>
    <!-- highlighted today -->
    <circle cx="730" cy="107" r="11" fill="#2563eb"/>
    <text x="730" y="111" text-anchor="middle" fill="#ffffff" font-weight="700">11</text>
    <text x="764" y="110" text-anchor="middle">12</text>
    <text x="798" y="110" text-anchor="middle">13</text>
    <text x="832" y="110" text-anchor="middle">14</text>
  </g>
  <!-- row 3 -->
  <g fill="#94a3b8" font-size="9" font-family="Arial, sans-serif">
    <text x="628" y="126" text-anchor="middle">15</text>
    <text x="662" y="126" text-anchor="middle">16</text>
    <!-- event dot -->
    <text x="696" y="126" text-anchor="middle" fill="#34d399">17</text>
    <circle cx="696" cy="129" r="2" fill="#34d399"/>
    <text x="730" y="126" text-anchor="middle">18</text>
    <text x="764" y="126" text-anchor="middle">19</text>
    <text x="798" y="126" text-anchor="middle">20</text>
    <text x="832" y="126" text-anchor="middle">21</text>
  </g>
  <!-- row 4 -->
  <g fill="#94a3b8" font-size="9" font-family="Arial, sans-serif">
    <text x="628" y="142" text-anchor="middle">22</text>
    <text x="662" y="142" text-anchor="middle">23</text>
    <text x="696" y="142" text-anchor="middle">24</text>
    <text x="730" y="142" text-anchor="middle">25</text>
    <!-- event dot -->
    <text x="764" y="142" text-anchor="middle" fill="#34d399">26</text>
    <circle cx="764" cy="145" r="2" fill="#34d399"/>
    <text x="798" y="142" text-anchor="middle">27</text>
    <text x="832" y="142" text-anchor="middle">28</text>
  </g>
  <!-- row 5 -->
  <g fill="#94a3b8" font-size="9" font-family="Arial, sans-serif">
    <text x="628" y="158" text-anchor="middle">29</text>
    <text x="662" y="158" text-anchor="middle">30</text>
  </g>

  <!-- event pill -->
  <rect x="618" y="165" width="224" height="10" rx="4" fill="#1a3a6e"/>
  <rect x="618" y="165" width="80" height="10" rx="4" fill="#2563eb"/>
  <text x="658" y="173" text-anchor="middle" fill="#ffffff" font-size="7" font-family="Arial, sans-serif">Meeting 10AM</text>

  <!-- accent bar -->
  <rect x="60" y="68" width="4" height="64" rx="2" fill="#10b981"/>

  <!-- title -->
  <text x="84" y="94" fill="#ffffff" font-size="32" font-family="Arial, sans-serif" font-weight="700">Calendar</text>
  <text x="84" y="122" fill="#34d399" font-size="32" font-family="Arial, sans-serif" font-weight="700">Manager Pro</text>
  <text x="84" y="140" fill="#64748b" font-size="12" font-family="Arial, sans-serif" letter-spacing="2">EVENT &amp; SCHEDULE MANAGEMENT IN C</text>

  <!-- tags -->
  <rect x="84" y="152" width="28" height="18" rx="9" fill="#0f2544" stroke="#1e4a8a" stroke-width="1"/>
  <text x="98" y="165" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="Arial, sans-serif">C</text>

  <rect x="120" y="152" width="66" height="18" rx="9" fill="#0f2544" stroke="#1e4a8a" stroke-width="1"/>
  <text x="153" y="165" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="Arial, sans-serif">Scheduling</text>

  <rect x="194" y="152" width="48" height="18" rx="9" fill="#0f2544" stroke="#1e4a8a" stroke-width="1"/>
  <text x="218" y="165" text-anchor="middle" fill="#60a5fa" font-size="10" font-family="Arial, sans-serif">Events</text>

  <text x="84" y="186" fill="#374151" font-size="11" font-family="Arial, sans-serif">by Harshvardhan Dhere</text>
</svg>
